name: Build and Push Docker Images

# Tag-Schema wie der RookHub-Stack:
#   - Push auf master        → :dev    (+ :sha)     → nur DEV
#   - Push eines vX.Y.Z-Tags → :latest (+ :version) → PROD (deliberate release)
# Nur reine Semver-Tags lösen aus, und der markierte Commit muss auf master liegen: ein Sicherungs-Tag
# (vorher-umbau, v-test, …) oder ein vX.Y.Z auf einem ungemergten Branch darf nie als :latest nach Prod.
on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: kahalm

jobs:
  # Test-Gate (wie rookhub/crawler): kein Image-Push (:dev, :latest), solange die API-Tests nicht grün sind.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/api/PirateChess.Api.Tests

  build-api:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release-Wächter (nur bei Tags): Tag-Form vX.Y.Z und Commit auf master, sonst Abbruch vor Login/Build.
      - id: release
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG ist kein Release-Tag der Form vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::Tag $TAG zeigt auf einen Commit, der nicht auf master liegt"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/piratechess-api
          # latest=false: sonst hängt type=semver bei latest=auto zusätzlich selbst :latest an.
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
