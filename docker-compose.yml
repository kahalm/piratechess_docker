# Beispiel für die LOKALE Entwicklung: eigener gluetun-Tunnel, eigene MariaDB, API aus dem Quellcode.
# Der Betrieb läuft NICHT über diese Datei: piratechess-api ist ein Dienst in /opt/stacks/rookhub-schach (Prod,
# :latest, zwei Tunnel, kein Host-Port) bzw. /opt/stacks/rookhub-schach-dev (Dev, :dev). Dort sind compose.yaml und
# .env maßgeblich (Proxy-/Rotations-Einstellungen, DB in der gemeinsamen rookhub-MariaDB, Logs ins gemeinsame ES).
# - Ports nur an 127.0.0.1: MariaDB (3308) und die API (5000) sind nicht aus dem Netz erreichbar, auch wenn die Datei
#   auf einem Server mit öffentlicher IP läuft.
# - Start: cp .env.example .env, Geheimnisse setzen, docker compose up --build
#   (docker-compose.override.yml kommt automatisch dazu: dotnet watch mit eingebundenem Quellcode).
# - gluetun-auth.toml steht wie Prod/Dev auf auth="none" und passt so zu GLUETUN_APIKEY= (leer) in .env.example;
#   die Umstellung auf auth="apikey" steht in gluetun-auth.toml.
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: piratechess-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-airvpn}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Netherlands}
      # Optionale Server-Einschränkung. ⚠️ VPN_SERVER_NAMES MUSS komma-getrennt OHNE
      # Leerzeichen sein ("A,B,C", nicht "A, B, C") — gluetun trimmt nicht, sonst matcht
      # nur der erste Name und der Tunnel rotiert nie wirklich (Details in .env.example).
      SERVER_NAMES: ${VPN_SERVER_NAMES:-}
      HTTPPROXY: "on"
      # Control-Server (:8000) für piratechess-api erreichbar machen → IP-Rotation.
      # 8888 = HTTP-Proxy muss mit aufgeführt bleiben.
      FIREWALL_INPUT_PORTS: "8888,8000"
    volumes:
      - gluetun_data:/gluetun
      # Control-Server-Auth: gibt die Rotations-Routen frei (gluetun latest verlangt sonst Auth → "Unauthorized")
      - ./gluetun-auth.toml:/gluetun/auth/config.toml:ro
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mariadb:11
    container_name: piratechess-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: piratechess-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Encryption__Key: ${ENCRYPTION_KEY}
      Service__ApiKey: ${SERVICE_API_KEY}
      Chessable__ProxyUrl: http://gluetun:8888
      # gluetun-Control-Server für die IP-Rotation (un-proxied). Leer lassen
      # deaktiviert die Rotation. Default: alle 20 Requests (Vpn__RotateAfterRequests).
      Gluetun__ControlUrl: ${GLUETUN_CONTROL_URL:-http://gluetun:8000}
      # Optionaler API-Key für den gluetun-Control-Server. Leer lassen → kein
      # X-API-Key-Header, passend zu auth="none" in gluetun-auth.toml (Ausgangszustand).
      # Nur zusammen mit auth="apikey" + demselben apikey in gluetun-auth.toml setzen.
      Gluetun__ApiKey: ${GLUETUN_APIKEY:-}
      Vpn__RotateAfterRequests: ${VPN_ROTATE_AFTER_REQUESTS:-20}
      # Kurs-Cache aus Browser-Uploads (A3-002): standardmäßig AUS. Kapitelzahl/„vollständig" sind Angaben des
      # Clients (kein eigener getCourse-Abruf) – ein erfundener Ein-Kapitel-Upload legte sonst den Kurs-Cache des
      # ganzen bids für alle Server-Importe an. Browser-Linien landen unabhängig davon im Linien-Cache.
      # true = Produktentscheidung (z. B. Fast-Lane/Reprocess für nur per Browser erfasste Kurse auf PROD).
      Chessable__BrowserCourseCacheEnabled: ${BROWSER_COURSE_CACHE_ENABLED:-false}
      # Strukturierte Logs (Serilog) gehen ins selbe Elasticsearch wie rookhub
      # → eigener Index `piratechess-logs-*`. URL leer lassen deaktiviert den
      # ES-Sink (Console-Logger bleibt aktiv).
      Elasticsearch__Url: ${ELASTICSEARCH_URL:-}
      Elasticsearch__IndexFormat: ${ELASTICSEARCH_INDEX_FORMAT:-piratechess-logs-{0:yyyy.MM}}
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      db:
        condition: service_healthy
      gluetun:
        condition: service_healthy
    networks:
      - default
      - chessable-bridge

volumes:
  db_data:
  gluetun_data:

networks:
  # Inter-stack bridge so rookhub-api can reach piratechess-api by its
  # container name. The network is named explicitly (not project-prefixed)
  # so other compose projects can join it as `external: true`.
  chessable-bridge:
    name: chessable-bridge
